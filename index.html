    const form=document.querySelector('#unlock'),input=document.querySelector('#password'),button=document.querySelector('#submit'),status=document.querySelector('#status');

      event.preventDefault();button.disabled=true;status.textContent='正在解密…';
      try{
        const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);

        const html=await new Response(stream).text();document.open();document.write(html);document.close();
